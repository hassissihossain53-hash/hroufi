name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Bundle fonts for offline use
        run: |
          mkdir -p www/fonts
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fL $B/tajawal/Tajawal-Regular.ttf -o www/fonts/t4.ttf
          curl -fL $B/tajawal/Tajawal-Medium.ttf -o www/fonts/t5.ttf
          curl -fL $B/tajawal/Tajawal-Bold.ttf -o www/fonts/t7.ttf
          curl -fL $B/tajawal/Tajawal-ExtraBold.ttf -o www/fonts/t8.ttf
          curl -fL "$B/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" -o www/fonts/cairo.ttf || rm -f www/fonts/cairo.ttf
          cat > www/fonts/fonts.css <<'CSS'
          @font-face{font-family:"Tajawal";font-weight:400;src:url(t4.ttf) format("truetype");font-display:block}
          @font-face{font-family:"Tajawal";font-weight:500;src:url(t5.ttf) format("truetype");font-display:block}
          @font-face{font-family:"Tajawal";font-weight:700;src:url(t7.ttf) format("truetype");font-display:block}
          @font-face{font-family:"Tajawal";font-weight:800;src:url(t8.ttf) format("truetype");font-display:block}
          CSS
          if [ -f www/fonts/cairo.ttf ]; then echo '@font-face{font-family:"Cairo";font-weight:200 1000;src:url(cairo.ttf) format("truetype");font-display:block}' >> www/fonts/fonts.css; fi
      - run: cp index.html www/index.html
      - run: |
          sed -i 's#<link href="https://fonts.googleapis.com[^>]*>#<link rel="stylesheet" href="fonts/fonts.css">#' www/index.html
      - run: |
          sed -i 's/"appName": *"[^"]*"/"appName": "حروفي المتقاطعة"/' capacitor.config.json
      - run: npm install
      - run: npx cap add android
      - run: |
          sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
      - name: App icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os,glob
          im=Image.open('icon.png').convert('RGBA')
          res='android/app/src/main/res'
          for d,s in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              r=im.resize((s,s),Image.LANCZOS)
              for n in ('ic_launcher','ic_launcher_round','ic_launcher_foreground'):
                  r.save(f'{res}/mipmap-{d}/{n}.png')
          for f in glob.glob(f'{res}/mipmap-anydpi*/*'): os.remove(f)
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hroufi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
