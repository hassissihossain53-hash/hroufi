<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e9a93"><style>html,body{margin:0;padding:0}body{min-height:100vh}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>حروفي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout concept: a single phone-width column of chunky letter tiles on a soft gradient; one skin changes the whole gradient. */
:root{
  --font-display:"Lalezar","Tajawal",system-ui,sans-serif;
  --font-body:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
  --g1:#0e9a93;
  --g2:#4cc9ae;
  --deep:#0a3f4a;
  --accent:#ffc233;
  --tile:#ffffff;
  --tile-edge:rgba(10,63,74,.22);
  --star:#f2a900;
  --star-off:#cfd6d9;
  --good:#168a4d;
  --bad:#cf3b3b;
  --veil:rgba(0,0,0,.26);
  --soft:#eef3f4;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0;
  background-color:var(--g1);
  background-image:linear-gradient(175deg,var(--g1),var(--g2));
  background-attachment:fixed;
  color:#fff;
  font-family:var(--font-body);
  font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 36px;
  min-height:100%;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}

/* header */
.top{display:flex;align-items:center;gap:8px}
.pill{background:var(--veil);color:#fff;border-radius:999px;height:40px;padding:0 14px;font:700 15px var(--font-body);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.top .title{flex:1;justify-content:center;font:400 clamp(15px,4.6vw,21px) var(--font-display);min-width:0;padding:0 4px;white-space:normal;text-align:center;line-height:1.15;height:auto;min-height:40px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22);flex:none}

.card{background:var(--tile);color:var(--deep);border-radius:20px;box-shadow:0 5px 0 var(--tile-edge);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:16px;background:var(--accent);color:var(--deep);font:800 17px var(--font-body);box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.big{min-height:62px;font:400 26px var(--font-display);width:100%}
.btn.plain{background:var(--soft)}

/* home */
.home{display:flex;flex-direction:column;gap:16px}
.logo{display:flex;justify-content:center;gap:8px;margin-top:10px}
.logo span{width:min(58px,calc((100vw - 64px)/5));aspect-ratio:1/1.12;display:grid;place-items:center;background:var(--tile);color:var(--deep);border-radius:14px;font:400 clamp(30px,10vw,46px)/1 var(--font-display);box-shadow:0 6px 0 var(--tile-edge)}
.logo span:nth-child(odd){transform:rotate(-4deg)}
.logo span:nth-child(even){transform:rotate(3deg) translateY(5px)}
.tag{text-align:center;margin:0;font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.levels h2{margin:0 0 12px;font:400 22px var(--font-display)}
.lvgrid{display:flex;flex-direction:column;gap:10px}
.lv{display:flex;align-items:center;gap:10px;width:100%;min-height:62px;padding:0 16px;border-radius:16px;background:var(--soft);color:var(--deep);text-align:start;box-shadow:0 4px 0 var(--tile-edge)}
.lv:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--tile-edge)}
.lv .lvn{flex:1;min-width:0;font:400 20px/1.25 var(--font-display)}
.lv .lvt{flex:none;font:700 12px/1 var(--font-body);padding:5px 10px;border-radius:999px;background:rgba(10,63,74,.1)}
.lv .st{flex:none;display:flex;gap:2px;direction:ltr;font-size:20px;line-height:1;color:var(--star)}
.lv .st i{font-style:normal}
.lv .st .off{color:var(--star-off)}
.lv .lock{flex:none;display:grid;place-items:center;width:34px}
.lv.now{background:var(--accent)}
.lv.now .lvt{background:rgba(10,63,74,.14)}
.lv:disabled{opacity:.5;box-shadow:none;cursor:default}
.note{text-align:center;margin:0;font-size:13px;font-weight:500;text-shadow:0 1px 0 rgba(0,0,0,.25)}

/* start screen */
.start{display:flex;flex-direction:column;justify-content:space-between;gap:32px;min-height:calc(100vh - 100px);min-height:calc(100dvh - 100px);padding-top:7vh}
.start .brand{display:flex;flex-direction:column;gap:18px}
.start .logo{margin-top:0}
.start .logo span{width:min(70px,calc((100vw - 72px)/5));font-size:clamp(36px,12vw,56px)}
.start .tag{font-size:18px}
.startbtns{display:flex;flex-direction:column;gap:14px;padding-bottom:12px}
.btn.ghost{background:var(--veil);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);min-height:54px;font-size:18px}
.gear{width:40px;padding:0;justify-content:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;padding:0 16px;border-radius:14px;background:var(--soft);color:var(--deep);font:800 18px var(--font-body)}
.tgl{direction:ltr;position:relative;flex:none;width:54px;height:32px;border-radius:999px;background:var(--star-off);transition:background .2s}
.tgl i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2);transition:transform .2s}
.tgl.on{background:var(--good)}
.tgl.on i{transform:translateX(22px)}
.lbl{margin:0 0 10px;font:800 18px var(--font-body);color:var(--deep)}

/* game */
.game{display:flex;flex-direction:column;gap:14px}
.clue{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:18px 16px}
.pic{font-size:54px;line-height:1.1}
.kind{font:700 13px var(--font-body);opacity:.7}
.sentence{margin:0;font:800 24px/1.7 var(--font-body);text-wrap:balance}
.blank{display:inline-block;width:3.2em;border-bottom:4px solid var(--deep);margin-inline-start:.25em}
.slots{display:flex;justify-content:center;gap:8px}
.slot{width:min(54px,calc((min(100vw,480px) - 32px - 8px*(var(--n) - 1))/var(--n)));aspect-ratio:1/1.1;border-radius:12px;background:var(--deep);color:#fff;font:700 clamp(24px,7.4vw,32px)/1 var(--font-body);display:grid;place-items:center;border-bottom:4px solid rgba(0,0,0,.35)}
.slot.filled{background:var(--deep);color:#fff}
.slot.locked{background:var(--accent);color:var(--deep)}
.slots.shake{animation:shake .45s}
.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile{width:calc((100% - 40px)/6);aspect-ratio:1;border-radius:12px;background:#f4f6f7;color:var(--deep);font:700 clamp(24px,7.4vw,31px)/1 var(--font-body);box-shadow:0 4px 0 var(--tile-edge);display:grid;place-items:center}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tile-edge)}
.tile.used,.tile.gone{visibility:hidden}
.hints{display:flex;gap:8px}
.hint{flex:1;min-height:50px;border-radius:14px;background:var(--veil);color:#fff;font:700 14px var(--font-body);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px}
.hint:active{transform:translateY(2px)}
.cost{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 9px;font-size:13px}
.cost .dot{width:11px;height:11px}

.gridwrap{display:flex;justify-content:center;padding-top:18px}
.cw{touch-action:none;display:grid;direction:rtl;gap:3px;--cell:min(42px,calc((min(100vw,480px) - 32px - 3px*(var(--cols) - 1))/var(--cols)));grid-template-columns:repeat(var(--cols),var(--cell));grid-auto-rows:var(--cell)}
.cell{border-radius:7px;background:#f4f6f7;color:#fff;font:700 clamp(19px,5.4vw,24px)/1 var(--font-body);display:grid;place-items:center;transition:background .2s}
.cell.void{visibility:hidden}
.cell.solved{background:var(--deep)}
.liveStars{display:flex;justify-content:center;gap:4px;font-size:32px;line-height:1;color:var(--star);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.liveStars .off{color:rgba(255,255,255,.4)}

/* question screen */
.qs{position:fixed;inset:0;z-index:25;overflow-y:auto;background-color:var(--g1);background-image:linear-gradient(175deg,var(--g1),var(--g2));color:#fff;display:flex;flex-direction:column}
.qbar{direction:ltr;display:flex;align-items:stretch;flex:none;background:color-mix(in srgb,var(--g1) 80%,#000);padding-top:env(safe-area-inset-top,0px)}
.qback{direction:rtl;display:flex;align-items:center;gap:9px;min-height:58px;padding:0 16px 0 max(16px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.22);font:700 17px var(--font-body)}
.qchev{width:30px;height:30px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font:700 20px/1 var(--font-body);padding-bottom:3px}
.qtitle{direction:rtl;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;font:400 22px var(--font-display)}
.qcoins{direction:rtl;display:flex;align-items:center;gap:8px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 8px;font:800 19px var(--font-body)}
.qwrap{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:22px;padding:26px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.qcard{width:min(100%,360px);border-radius:14px;overflow:hidden;background:#fff;color:var(--deep);box-shadow:0 5px 0 rgba(0,0,0,.22)}
.qhead{background:color-mix(in srgb,var(--g1) 80%,#000);color:#fff;text-align:center;font:400 24px/1.2 var(--font-display);padding:12px 10px 10px;border-bottom:3px solid rgba(0,0,0,.28)}
.qflag{width:min(260px,78%);aspect-ratio:3/2;object-fit:contain;border-radius:6px;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.25);background:#fff}.qlogo{width:auto;max-width:86%;max-height:190px;border-radius:8px;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 6px 16px rgba(0,0,0,.22)}.qflagcap{font:700 18px var(--font-body);opacity:.8;margin-bottom:10px}
.qtext{min-height:170px;display:grid;place-items:center;padding:22px 20px;text-align:center;font:800 26px/1.7 var(--font-body);text-wrap:balance}
.qtools{display:flex;background:color-mix(in srgb,var(--g1) 80%,#000);border-top:3px solid rgba(0,0,0,.28)}
.qtool{flex:1;min-width:0;min-height:58px;display:flex;align-items:center;justify-content:center;gap:7px;color:#fff;font:700 15px var(--font-body);padding:0 6px}
.qtool+.qtool{border-inline-start:3px solid rgba(0,0,0,.28)}
.qtool:active{background:rgba(0,0,0,.18)}
.qtool svg{flex:none}
.qwrap .slots{width:100%}
.qwrap .pool{width:min(100%,380px)}

/* overlays */
.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.win{width:min(100%,360px);text-align:center;display:grid;gap:12px;padding:22px}
.win h2{margin:0;font:400 40px/1.1 var(--font-display)}
.win p{margin:0}
.done{font:800 19px/1.6 var(--font-body)}
.bigstars{display:flex;justify-content:center;gap:6px;font-size:54px;line-height:1}
.bigstars span{color:var(--star-off)}
.bigstars span.on{color:var(--star);animation:pop .5s both;animation-delay:calc(var(--i)*.2s)}
.reward{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:800 18px var(--font-body)}
.sheet{width:min(100%,380px);display:grid;gap:14px}
.sheet h2{margin:0;font:400 24px var(--font-display)}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;font:700 12px var(--font-body);color:var(--deep)}
.sw i{width:100%;aspect-ratio:1;border-radius:50%;display:block;border:3px solid transparent;box-shadow:0 3px 0 var(--tile-edge)}
.sw.on i{border-color:var(--deep)}
#toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:30}
#toast div{background:var(--deep);color:#fff;border-radius:14px;padding:11px 18px;font:700 15px var(--font-body);box-shadow:0 4px 0 rgba(0,0,0,.25)}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app" dir="rtl" lang="ar">
  <header class="top">
    <button class="pill" id="btnBack" data-act="home" aria-label="رجوع إلى المستويات" hidden>→</button>
    <div class="title pill" id="topTitle" style="background:none"></div>
    <div class="pill" aria-label="العملات"><span class="dot"></span><span id="coins">0</span></div>

  </header>
  <main id="screen"></main>
</div>

<div class="modal" id="win" dir="rtl" lang="ar" hidden></div>
<div class="modal" id="sheet" dir="rtl" lang="ar" hidden></div>
<div class="qs" id="qscreen" dir="rtl" lang="ar" hidden>
  <div class="qbar">
    <button class="qback" data-act="qback" aria-label="رجوع"><span class="qchev">‹</span>رجوع</button>
    <div class="qtitle" id="qtitle"></div>
    <div class="qcoins"><span id="qcoins">0</span><span class="dot"></span></div>
  </div>
  <div class="qwrap" id="qbox"></div>
</div>

var save={coins:100,stars:LEVELS.map(function(){return 0}),unlocked:1,skin:0,sound:true,ver:3,prog:{}};
try{
  var raw=JSON.parse(localStorage.getItem('hroufi.v1')||'null');
  if(raw&&typeof raw==='object'){
    if(+raw.coins>=0)save.coins=+raw.coins;
    if(Array.isArray(raw.stars))save.stars=LEVELS.map(function(_,i){return Math.min(3,Math.max(0,raw.stars[i]|0))});
    save.unlocked=Math.min(LEVELS.length,Math.max(1,raw.unlocked|0));
    save.skin=Math.max(0,Math.min(SKINS.length-1,raw.skin|0));
    if(raw.sound===false)save.sound=false;
    if(raw.prog&&typeof raw.prog==='object')save.prog=raw.prog;
    /* v2: the odd-numbered levels became crosswords, so their old stars no longer apply */
    if(raw.ver!==3)save.stars=LEVELS.map(function(){return 0});
  }
}catch(e){}
function saveProg(){

/* ---------- sound ---------- */
var audio=null;
function ac(){
  if(!save.sound)return null;
  try{
    if(!audio){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;audio=new C()}
    if(audio.state==='suspended')audio.resume();
    return audio;
  }catch(e){return null}
}
function tone(f,t0,d,type,vol){
  var a=ac();if(!a)return;
  try{
    var o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);
  }catch(e){}
}
function sfx(n){
  if(!save.sound)return;
  if(n==='tap')tone(660,0,0.07,'triangle',0.12);
  else if(n==='ok'){tone(523,0,0.12,'sine',0.16);tone(784,0.1,0.2,'sine',0.16)}
  else if(n==='bad'){
    /* wrong answer: short descending buzzer */
    tone(311,0,0.16,'square',0.08);tone(233,0.15,0.16,'square',0.08);tone(156,0.3,0.34,'sawtooth',0.09);
  }
  else if(n==='win'){
    /* level complete: rising fanfare then a bright final chord */
    [392,523,659,784].forEach(function(f,i){tone(f,i*0.11,0.2,'triangle',0.17)});
    [1047,1319,1568].forEach(function(f){tone(f,0.5,0.7,'sine',0.13)});
    [523,659,784].forEach(function(f){tone(f,0.5,0.7,'triangle',0.09)});
    tone(1760,0.78,0.5,'sine',0.08);tone(2093,0.9,0.5,'sine',0.06);
  }
}

function finish(){
  if(st.done)return;st.done=true;
  var pen=st.hints+st.mistakes,stars=st.k==='c'?starsNow():(pen===0?3:pen<=2?2:1);
  var old=save.stars[cur];
  var reward=old===0?10+5*stars:5*Math.max(0,stars-old);
  save.stars[cur]=Math.max(old,stars);delete save.prog[cur];
  save.coins+=reward;
  save.unlocked=Math.max(save.unlocked,Math.min(LEVELS.length,cur+2));
  persist();updateCoins();buzz();sfx('win');
  var last=cur>=LEVELS.length-1;
  var L=LEVELS[cur];
  var line=L.t==='p'?'<p class="done">'+L.before+' <b>'+L.ans+'</b></p>':'';
  $('#win').innerHTML='<div class="card win" role="dialog" aria-label="نتيجة المستوى">'
   +'<h2>'+(stars===3?'ممتاز!':stars===2?'أحسنت!':'برافو!')+'</h2>'
   +line
   +'<div class="bigstars">'+[1,2,3].map(function(k){return '<span class="'+(k<=stars?'on':'')+'" style="--i:'+k+'">★</span>'}).join('')+'</div>'
   +(reward>0?'<p class="reward"><span class="dot"></span>+'+reward+' عملة</p>':'<p class="reward">جرّب بلا مساعدة باش تاخد نجوم أكثر</p>')
   +(last?'<p>سالات كل المستويات. نزيدو مستويات جديدة قريب.</p>':'')
   +'<button class="btn" data-act="'+(last?'home':'next')+'">'+(last?'رجوع إلى المستويات':'المستوى التالي')+'</button>'

}

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

function startPhrase(L){
  var ans=L.ans.split('');
  var pool=ans.map(function(c){return {ch:c,extra:false,gone:false,lock:false}})
    .concat(L.extra.split('').map(function(c){return {ch:c,extra:true,gone:false,lock:false}}));
  shuffle(pool);
  st={k:'p',ans:ans,ansStr:L.ans,pool:pool,slots:ans.map(function(){return -1}),lock:ans.map(function(){return false}),hints:0,mistakes:0,busy:false,done:false};
  $('#screen').innerHTML='<section class="game">'
   +'<div class="card clue"><div class="pic" aria-hidden="true">'+L.pic+'</div><div class="kind">'+L.kind+'</div>'
   +'<p class="sentence">'+L.before+' <span class="blank"></span></p></div>'
   +'<div class="slots" id="slots" style="--n:'+ans.length+'"></div>'
   +'<div class="pool" id="pool"></div>'
   +'<div class="hints">'
   +'<button class="hint" data-act="reveal">اكشف حرف <span class="cost"><span class="dot"></span>10</span></button>'
   +'<button class="hint" data-act="del">احذف حرف <span class="cost"><span class="dot"></span>5</span></button>'
   +'<button class="hint" data-act="clear">امسح</button>'
   +'</div></section>';
  renderP();
}

function renderP(){
  var P=st,h='';
  P.slots.forEach(function(pi,i){
    var t=pi>=0?P.pool[pi].ch:'';
    h+='<button class="slot'+(t?' filled':'')+(P.lock[i]?' locked':'')+'" data-act="slot" data-v="'+i+'" aria-label="حرف '+(i+1)+'">'+t+'</button>';
  });
  $('#slots').innerHTML=h;
  h='';
  P.pool.forEach(function(t,i){
    var used=P.slots.indexOf(i)>=0;
    h+='<button class="tile'+(used?' used':'')+(t.gone?' gone':'')+'" data-act="pick" data-v="'+i+'">'+t.ch+'</button>';
  });
  $('#pool').innerHTML=h;
}

function pickP(pi){
  var P=st;if(P.busy||P.done)return;
  var t=P.pool[pi];if(!t||t.gone||P.slots.indexOf(pi)>=0)return;
  var i=P.slots.indexOf(-1);if(i<0)return;
  P.slots[i]=pi;renderP();checkP();
}
function slotP(i){
  var P=st;if(P.busy||P.done)return;
  if(P.lock[i]||P.slots[i]<0)return;
  P.slots[i]=-1;renderP();
}
function clearP(){
  var P=st;if(P.busy||P.done)return;
  P.slots=P.slots.map(function(pi,k){return P.lock[k]?pi:-1});renderP();
}
function checkP(){
  var P=st;
  if(P.slots.indexOf(-1)>=0)return;
  var w=P.slots.map(function(pi){return P.pool[pi].ch}).join('');
  if(w===P.ansStr){finish();return}
  P.mistakes++;P.busy=true;buzz();sfx('bad');
  $('#slots').classList.add('shake');
  setTimeout(function(){
    if(!st||st!==P)return;
    P.busy=false;
    P.slots=P.slots.map(function(pi,k){return P.lock[k]?pi:-1});
    renderP();
  },650);
}
function revealP(){
  var P=st;if(P.busy||P.done)return;
  var n=P.slots.length,i=-1,k;
  for(k=0;k<n;k++){
    if(P.lock[k])continue;
    var pk=P.slots[k];
    if(pk<0||P.pool[pk].ch!==P.ans[k]){i=k;break}
  }
  if(i<0)return;
  if(!spend(10))return;
  var need=P.ans[i],t=-1,p;
  for(p=0;p<P.pool.length;p++){
    var T=P.pool[p];
    if(T.ch===need&&!T.gone&&!T.lock&&P.slots.indexOf(p)<0){t=p;break}
  }
  if(t<0){
    for(var j=0;j<n;j++){
      var pj=P.slots[j];
      if(j!==i&&pj>=0&&!P.lock[j]&&P.pool[pj].ch===need){t=pj;P.slots[j]=-1;break}
    }
  }
  if(t<0)return;
  P.slots[i]=t;P.lock[i]=true;P.pool[t].lock=true;P.hints++;
  renderP();checkP();
}
function delP(){
  var P=st;if(P.busy||P.done)return;
  var c=[];
  P.pool.forEach(function(t,i){if(t.extra&&!t.gone&&!t.lock&&P.slots.indexOf(i)<0)c.push(i)});
  if(!c.length){toast('ما بقى حتى حرف زايد');return}
  if(!spend(5))return;
  P.pool[c[Math.floor(Math.random()*c.length)]].gone=true;
  P.hints++;renderP();
}

/* ---------- crossword ---------- */
var PENCIL='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 20l1.2-4.8L16.5 3.9a1.5 1.5 0 0 1 2.1 0l1.5 1.5a1.5 1.5 0 0 1 0 2.1L8.8 18.8z"/><path d="M14.5 6l3.5 3.5"/></svg>';
var ERASER='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M8 20h12"/><path d="M5.5 14.5l8-8a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 19.5H8l-2.5-2.5a2 2 0 0 1 0-2.5z"/></svg>';

function buildCW(L){
  var cells={};
  var words=L.words.map(function(w,wi){
    var keys=[];
    for(var i=0;i<w.a.length;i++){
      var r=w.r+(w.d==='d'?i:0),c=w.c+(w.d==='a'?i:0),k=r+','+c;
      if(!cells[k])cells[k]={ans:w.a[i],val:'',words:[],flip:0};
      cells[k].words.push(wi);keys.push(k);
    }
    return {a:w.a,d:w.d,clue:w.clue,f:w.f,l:w.l,keys:keys};
  });
  return {k:'c',cells:cells,words:words,rows:L.rows,cols:L.cols,hints:0,mistakes:0,done:false};
}
function wordDone(w){return w.keys.every(function(k){return st.cells[k].val})}
function starsNow(){
  var p=st.hints+st.mistakes,n=st.words.length;
  return p<=Math.ceil(n/4)?3:p<=Math.ceil(n/2)?2:1;
}
function renderStars(){
  saveProg();
  var el=$('#liveStars');if(!el||!st||st.k!=='c')return;
  var s=starsNow();
  el.innerHTML=[1,2,3].map(function(i){return '<span class="'+(i<=s?'':'off')+'">★</span>'}).join('');
}

var q=null,lastOpen=0;

function startCW(L){
  st=buildCW(L);q=null;
  try{var P=save.prog[cur];
    if(P&&P.v){Object.keys(P.v).forEach(function(k){if(st.cells[k]&&st.cells[k].ans===P.v[k])st.cells[k].val=P.v[k]});st.hints=P.h|0;st.mistakes=P.m|0}
  }catch(e){}
  $('#qscreen').hidden=true;
  $('#screen').innerHTML='<section class="game">'
   +'<div class="liveStars" id="liveStars" aria-label="النجوم"></div>'
   +'<div class="gridwrap"><div class="cw" id="cw" style="--cols:'+L.cols+'"></div></div>'
   +'</section>';
  renderCW();renderStars();
}

function renderCW(){
  var c=st,h='';
  for(var r=0;r<c.rows;r++){
    for(var cc=0;cc<c.cols;cc++){
      var k=r+','+cc,cell=c.cells[k];
      if(!cell){h+='<div class="cell void"></div>';continue}
      h+='<button class="cell'+(cell.val?' solved':'')+'" data-act="cell" data-v="'+k+'" aria-label="خانة">'+cell.val+'</button>';
    }
  }
  $('#cw').innerHTML=h;
}

function tapCell(k){
  var c=st;
  if(!c||c.k!=='c'||c.done||q||Date.now()-lastOpen<500)return;
  var cell=c.cells[k];if(!cell)return;
  var open=cell.words.filter(function(wi){return !wordDone(c.words[wi])});
  if(!open.length)return;
  var wi=open[cell.flip%open.length];cell.flip++;
  openQ(wi);
}

/* drag a finger along a line of cells to open that word's question */
var drag=null;
function cellKeyAt(x,y){
  var el=document.elementFromPoint(x,y);
  var b=el&&el.closest?el.closest('[data-act="cell"]'):null;
  return b?b.dataset.v:null;
}
function commonWord(a,b){
  for(var i=0;i<st.words.length;i++){
    var ks=st.words[i].keys;
    if(ks.indexOf(a)>=0&&ks.indexOf(b)>=0)return i;
  }
  return -1;
}
document.addEventListener('pointerdown',function(e){
  if(!st||st.k!=='c'||st.done||q)return;
  var b=e.target.closest?e.target.closest('[data-act="cell"]'):null;
  drag=b?{start:b.dataset.v,w:-1}:null;
});
document.addEventListener('pointermove',function(e){
  if(!drag||!st||st.k!=='c')return;
  var k=cellKeyAt(e.clientX,e.clientY);
  if(k&&k!==drag.start){var w=commonWord(drag.start,k);if(w>=0)drag.w=w}
});
document.addEventListener('pointerup',function(){
  var d=drag;drag=null;
  if(!d||d.w<0||!st||st.k!=='c'||st.done||q)return;
  openQ(d.w);
});
document.addEventListener('pointercancel',function(){drag=null});

/* ---------- question screen ---------- */
function qLetter(i){return q.given[i]||(q.slots[i]>=0?q.pool[q.slots[i]].ch:'')}

function openQ(wi){
  var c=st;if(!c||c.k!=='c'||c.done)return;
  var w=c.words[wi];if(wordDone(w))return;
  lastOpen=Date.now();
  var n=w.a.length;
  var given=w.keys.map(function(k){return c.cells[k].val});
  var pool=[];
  w.a.split('').forEach(function(ch,i){if(!given[i])pool.push({ch:ch,extra:false,gone:false})});
  shuffle(KEYS.filter(function(k){return w.a.indexOf(k)<0})).slice(0,4).forEach(function(ch){pool.push({ch:ch,extra:true,gone:false})});
  shuffle(pool);
  q={wi:wi,w:w,given:given,lock:given.map(function(g){return !!g}),pool:pool,slots:given.map(function(){return -1}),busy:false};
  $('#qtitle').textContent=lvName(cur);
  $('#qbox').innerHTML=
    '<div class="qcard">'
   +'<div class="qhead">'+(w.d==='a'?'أفقي':'عمودي')+' · '+n+' حروف</div>'
   +'<div class="qtext">'+(w.l&&LOGOS[w.l]?'<div class="qflagcap">اي ماركة سيارات هذا الشعار؟</div><img class="qlogo" alt="شعار سيارة" src="'+LOGOS[w.l]+'">':w.f&&FLAGS[w.f]?'<div class="qflagcap">علم أي دولة هذا؟</div><img class="qflag" alt="علم دولة" src="'+FLAGS[w.f]+'">':w.clue)+'</div>'
   +'<div class="qtools">'
   +'<button class="qtool" data-act="qdel">'+ERASER+'<span>احذف حرف</span><span class="cost"><span class="dot"></span>5</span></button>'
   +'<button class="qtool" data-act="qreveal">'+PENCIL+'<span>اكشف حرف</span><span class="cost"><span class="dot"></span>10</span></button>'
   +'</div></div>'
   +'<div class="slots" id="qslots" style="--n:'+n+'"></div>'
   +'<div class="pool" id="qpool"></div>';
  $('#qscreen').hidden=false;
  $('#qscreen').scrollTop=0;
  renderQ();
}

function renderQ(){
  var h='',i;
  for(i=0;i<q.w.a.length;i++){
    h+='<button class="slot'+(q.lock[i]?' locked':'')+'" data-act="qslot" data-v="'+i+'" aria-label="حرف '+(i+1)+'">'+qLetter(i)+'</button>';
  }
  $('#qslots').innerHTML=h;
  h='';
  q.pool.forEach(function(t,j){
    h+='<button class="tile'+(q.slots.indexOf(j)>=0?' used':'')+(t.gone?' gone':'')+'" data-act="qpick" data-v="'+j+'">'+t.ch+'</button>';
  });
  $('#qpool').innerHTML=h;
}

function closeQ(){q=null;var s=$('#qscreen');if(s)s.hidden=true}

function pickQ(pi){
  if(!q||q.busy)return;
  var t=q.pool[pi];if(!t||t.gone||q.slots.indexOf(pi)>=0)return;
  var i=-1;
  for(var k=0;k<q.w.a.length;k++){if(!q.given[k]&&q.slots[k]<0){i=k;break}}
  if(i<0)return;
  q.slots[i]=pi;renderQ();checkQ();
}
function slotQ(i){
  if(!q||q.busy||q.lock[i]||q.slots[i]<0)return;
  q.slots[i]=-1;renderQ();
}
function checkQ(){
  var n=q.w.a.length,s='',i;
  for(i=0;i<n;i++){var t=qLetter(i);if(!t)return;s+=t}
  if(s===q.w.a){solveQ();return}
  st.mistakes++;renderStars();q.busy=true;buzz();sfx('bad');
  var cu=q;
  $('#qslots').classList.add('shake');
  setTimeout(function(){
    if(q!==cu)return;
    q.busy=false;
    q.slots=q.slots.map(function(){return -1});
    renderQ();
  },650);
}
function solveQ(){
  var cu=q;cu.busy=true;buzz();sfx('ok');
  cu.w.keys.forEach(function(k,i){st.cells[k].val=cu.w.a[i]});
  saveProg();
  var ss=document.querySelectorAll('#qslots .slot');
  for(var i=0;i<ss.length;i++)ss[i].classList.add('locked');
  setTimeout(function(){
    if(q!==cu)return;
    closeQ();renderCW();checkWin();
  },450);
}
function checkWin(){
  if(!st||st.k!=='c')return;
  var all=Object.keys(st.cells).every(function(k){return st.cells[k].val});
  if(all)finish();
}
function revealQ(){
  if(!q||q.busy)return;
  var n=q.w.a.length,i=-1,k;
  for(k=0;k<n;k++){if(!q.given[k]&&qLetter(k)!==q.w.a[k]){i=k;break}}
  if(i<0)return;
  if(!spend(10))return;
  var need=q.w.a[i],t=-1,p;
  for(p=0;p<q.pool.length;p++){
    var T=q.pool[p];
    if(!T.extra&&!T.gone&&T.ch===need){
      if(q.slots.indexOf(p)<0){t=p;break}
      if(t<0)t=p;
    }
  }
  if(t>=0){var j=q.slots.indexOf(t);if(j>=0)q.slots[j]=-1;q.pool[t].gone=true}
  q.given[i]=need;q.lock[i]=true;q.slots[i]=-1;
  st.cells[q.w.keys[i]].val=need;
  st.hints++;renderStars();renderCW();renderQ();checkQ();
}
function delQ(){
  if(!q||q.busy)return;
  var c=[];
  q.pool.forEach(function(t,i){if(t.extra&&!t.gone&&q.slots.indexOf(i)<0)c.push(i)});
  if(!c.length){toast('ما بقى حتى حرف زايد');return}
  if(!spend(5))return;
  q.pool[c[Math.floor(Math.random()*c.length)]].gone=true;
  st.hints++;renderStars();renderQ();
}

/* ---------- events ---------- */
function openSettings(){
  var h='<div class="card sheet" role="dialog" aria-label="الإعدادات"><h2>الإعدادات</h2>'
   +'<button class="row" data-act="togglesound" role="switch" aria-checked="'+(save.sound?'true':'false')+'"><span>الصوت</span><span class="tgl'+(save.sound?' on':'')+'"><i></i></span></button>'
   +'<div><p class="lbl">الألوان</p><div class="swatches">';
  SKINS.forEach(function(s,i){
    h+='<button class="sw'+(i===save.skin?' on':'')+'" data-act="setskin" data-v="'+i+'" aria-label="'+s.n+'"><i style="background:linear-gradient(135deg,'+s.g1+','+s.g2+')"></i>'+s.n+'</button>';
  });
  h+='</div></div><button class="btn" data-act="close">تم</button></div>';
  $('#sheet').innerHTML=h;$('#sheet').hidden=false;
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,v=b.dataset.v;
  if(a!=='togglesound')sfx('tap');
  switch(a){
    case 'start':showStart();break;
    case 'home':showHome();break;
    case 'level':startLevel(+v);break;
    case 'next':startLevel(cur+1);break;
    case 'settings':openSettings();break;
    case 'togglesound':save.sound=!save.sound;persist();sfx('tap');openSettings();break;
    case 'setskin':applySkin(+v);openSettings();break;
    case 'close':$('#sheet').hidden=true;break;
    case 'pick':pickP(+v);break;
    case 'slot':slotP(+v);break;
    case 'reveal':revealP();break;
    case 'del':delP();break;
    case 'clear':clearP();break;
    case 'cell':tapCell(v);break;
    case 'qback':closeQ();break;
    case 'qpick':pickQ(+v);break;
    case 'qslot':slotQ(+v);break;
    case 'qdel':delQ();break;
    case 'qreveal':revealQ();break;
  }
});
$('#sheet').addEventListener('click',function(e){if(e.target===this)this.hidden=true});

applySkin(save.skin);
updateCoins();
showStart();
})();
</script>
